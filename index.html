/* ---------------- 유틸 ---------------- */

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);

const sun = new THREE.DirectionalLight(0xfff1dc, 0.85);

sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = -18; sc.right = 18; sc.top = 18; sc.bottom = -18; sc.near = 1; sc.far = 90;

const SUN_OFF = new THREE.Vector3(22, 34, 14);

/* ---------------- 재료 / 지오메트리 ---------------- */
const matCache = new Map();

const G = {

}

/* ---------------- 지형 · 제민천 ---------------- */
const cz = x => -6 + 3 * Math.sin(x * 0.16 + 0.5);     // 시냇물 중심선
const czp = x => 0.48 * Math.cos(x * 0.16 + 0.5);
const mounds = [
  { x: -12, z: 12, r: 7, h: 1.6 }, { x: 17, z: 14, r: 6, h: 1.1 },
  { x: 18, z: -16, r: 5.8, h: 1.8, flat: 3.0 }

const heightAt = terrainAt;

const walkAt = (x, z) => Math.max(terrainAt(x, z), bridgeAt(x, z));
const streamDist = (x, z) => Math.abs(z - cz(x));

{
  const GS = 140, SEG = 140;
  const gg = new THREE.PlaneGeometry(GS, GS, SEG, SEG); gg.rotateX(-Math.PI / 2);
  const pos = gg.attributes.position; const cols = new Float32Array(pos.count * 3);
  const cA = new THREE.Color(0x6fc878), cB = new THREE.Color(0x9ddc86), cC = new THREE.Color(0x58b86f), cS = new THREE.Color(0xe3d9b4), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = terrainAt(x, z);
    pos.setY(i, h);
    const n = 0.5 + 0.5 * Math.sin(x * 0.6 + z * 0.2) * Math.sin(z * 0.5 - x * 0.3);
    tmp.copy(cA).lerp(cB, clamp(Math.max(h, 0) / 2.2 * 0.7 + n * 0.45, 0, 1));
    const d = Math.hypot(x, z); if (d > 34) tmp.lerp(cC, clamp((d - 34) / 14, 0, 0.7));
    const dd = streamDist(x, z); if (dd < 3.0) tmp.lerp(cS, clamp((1 - dd / 3.0) * 1.5, 0, 0.9));
    cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
  }
  gg.setAttribute('color', new THREE.BufferAttribute(cols, 3)); gg.computeVertexNormals();
  const ground = new THREE.Mesh(gg, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.receiveShadow = true; scene.add(ground);
}

/* 멀리 보이는 뒷동산 */
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2 + rand(-0.1, 0.1), r = rand(58, 78), rad = rand(14, 24);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const col = new THREE.Color(0x7fd08a).lerp(new THREE.Color(0xbfe8b8), rng() * 0.6);
  const h = new THREE.Mesh(G.sph, new THREE.MeshLambertMaterial({ color: col }));
  h.scale.set(rad * 1.2, rad * 0.55, rad * 1.2); h.position.set(x, terrainAt(x, z) - rad * 0.12, z); scene.add(h);
}

/* 시냇물 */
let waterTex;
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#9fd8ff'; g.fillRect(0, 0, 256, 64);
  g.strokeStyle = 'rgba(235,248,255,.85)'; g.lineWidth = 2.5; g.lineCap = 'round';
  const r2 = mulberry32(7);
  for (let i = 0; i < 26; i++) {
    const x = r2() * 256, y = r2() * 64, w = 14 + r2() * 26;
    for (const ox of [0, -256, 256]) { g.beginPath(); g.moveTo(x + ox, y); g.quadraticCurveTo(x + ox + w / 2, y - 3, x + ox + w, y); g.stroke(); }
  }
  waterTex = new THREE.CanvasTexture(c); waterTex.colorSpace = THREE.SRGBColorSpace;
  waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
  const P = [], UV = [], IDX = [];
  for (let x = -34, i = 0; x <= 34; x++, i++) {
    const c0 = cz(x); P.push(x, -0.15, c0 - 2.5, x, -0.15, c0 + 2.5); UV.push((x + 34) / 8, 0, (x + 34) / 8, 1);
    if (i > 0) { const a = (i - 1) * 2; IDX.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); wg.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2)); wg.setIndex(IDX);
  const water = new THREE.Mesh(wg, new THREE.MeshBasicMaterial({ map: waterTex, transparent: true, opacity: 0.82, depthWrite: false }));
  water.renderOrder = 1; scene.add(water);
}
/* 냇가 조약돌 */
{
  const N = 150, mesh = new THREE.InstancedMesh(G.sphLow, mat(0xffffff), N), d = new THREE.Object3D(), col = new THREE.Color(), pal = [0xf1e8d6, 0xd9d4cc, 0xf3d5cf, 0xc9d3d6];
  let n = 0;
  for (let i = 0; i < N; i++) {
    const x = rand(-30, 30); if (Math.abs(x - BX) < 1.6) continue;
    const z = cz(x) + (rng() < 0.5 ? -1 : 1) * rand(1.9, 3.2), s = rand(0.08, 0.2);
    d.position.set(x, terrainAt(x, z) + s * 0.3, z); d.scale.set(s * 1.3, s, s * 1.1); d.rotation.set(0, rng() * 3, 0); d.updateMatrix();
    mesh.setMatrixAt(n, d.matrix); mesh.setColorAt(n, col.set(pick(pal))); n++;
  }
  mesh.count = n; scene.add(mesh);
}

/* ---------------- 충돌 ---------------- */
const colliders = [];
const addCollider = (x, z, r) => colliders.push({ x, z, r });

      const lx = dx * cs - dz * sn, lz = dx * sn + dz * cs;

    } else {
      const dx = p.x - c.x, dz = p.z - c.z, md = c.r + pr, d2 = dx * dx + dz * dz;

}
function clampRadius(p, R) { const d = Math.hypot(p.x, p.z); if (d > R) { p.x *= R / d; p.z *= R / d; } }
const reserved = [{ x: 2, z: 9, r: 3.5 }, { x: -4, z: 4, r: 2.8 }, { x: 18, z: -16, r: 6.5 }, { x: BX, z: BCZ, r: 4.5 }];
function freeSpot(minDist, maxR = 26) {
  for (let i = 0; i < 40; i++) {
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * maxR, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (streamDist(x, z) < 4) continue;
    if (colliders.some(c => Math.hypot(x - c.x, z - c.z) < c.r + minDist)) continue;
    if (reserved.some(c => Math.hypot(x - c.x, z - c.z) < c.r)) continue;
    return { x, z };
  }
  return null;
}

/* ---------------- 귀여운 캐릭터 만들기 ---------------- */
function makeCritter(o) {
  const sx = o.sx || 1, sy = o.sy || 1, rx = 0.5 * sx, ry = 0.46 * sy, rz = 0.44, cy = 0.62;
  const root = new THREE.Group(), bodyG = new THREE.Group(); root.add(bodyG);
  const bodyM = mat(o.body), limbM = mat(o.limb ?? o.body), cheekM = mat(o.cheek || 0xffa8c0), dark = mat(o.eye ?? 0x4a3340), white = mat(0xffffff);

  if (o.base) bodyG.add(part(G.sph, mat(o.base), rx * 0.82, 0.2, rz * 0.86, 0, cy - ry + 0.07, 0));
  const fz = (dx, dy) => rz * Math.sqrt(Math.max(0.02, 1 - (dx / rx) ** 2 - (dy / ry) ** 2));
  if (o.nut) {
    /* 알밤: 뽀얀 아랫부분 + 살짝 뾰족한 윗부분 + 반짝이는 윤기 */
    const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 10, 0, Math.PI * 2, Math.PI * 0.6, Math.PI * 0.4), mat(o.capColor || 0xfff0d6));
    cap.scale.set(rx * 1.004, ry * 1.004, rz * 1.004); cap.position.y = cy; bodyG.add(cap);
    const tip = part(G.cone, mat(o.tipColor || 0xa86a3e), 0.27, 0.34, 0.25, 0, cy + ry - 0.1 + 0.17, 0, true); tip.rotation.z = 0.1; bodyG.add(tip);
    const stemTop = cy + ry - 0.1 + 0.34, lm = mat(0x8fd47a);
    const sp = new THREE.Group(); sp.position.set(-0.016, stemTop - 0.01, 0); sp.rotation.z = 0.1; bodyG.add(sp);
    sp.add(part(G.cyl, lm, 0.016, 0.1, 0.016, 0, 0.05, 0));

    shine.scale.set(0.09, 0.05, 0.02); shine.position.set(-0.2, cy + 0.27, 0.3); shine.rotation.z = 0.7; shine.rotation.y = -0.5; bodyG.add(shine);

      bodyG.add(part(G.sphLow, white, 0.022, 0.022, 0.01, s * ex + 0.02, cy + ey + 0.03, fz(ex, ey) + 0.024));
      bodyG.add(part(G.sphLow, white, 0.011, 0.011, 0.008, s * ex - 0.02, cy + ey - 0.025, fz(ex, ey) + 0.026));
      const br = part(G.box, browM, 0.085, 0.016, 0.012, s * ex, cy + ey + 0.125, fz(ex, ey + 0.125) + 0.003); br.rotation.z = s * 0.12; bodyG.add(br);
    } else {
      bodyG.add(part(G.sphLow, dark, 0.05, 0.06, 0.03, s * ex, cy + ey, fz(ex, ey)));
      bodyG.add(part(G.sphLow, white, 0.016, 0.016, 0.01, s * ex + 0.014, cy + ey + 0.02, fz(ex, ey) + 0.025));
    }
    const cx = 0.3 * sx, cyy = -0.07;
    const ch = part(G.sph, cheekM, o.nut ? 0.09 : 0.085, 0.06, 0.03, s * cx, cy + cyy, fz(cx, cyy) - 0.004); ch.rotation.y = s * 0.7; bodyG.add(ch);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.01, 6, 12, Math.PI), dark);
  mouth.rotation.z = Math.PI; mouth.position.set(0, cy - 0.04, fz(0, -0.04) + 0.004); bodyG.add(mouth);

  const top = cy + ry, earM = mat(o.ear ?? o.body), inM = mat(o.inner || 0xffc4d6);

      g.add(part(G.sph, earM, 0.13, 0.14, 0.07, 0, 0.05, 0, true)); g.add(part(G.sph, inM, 0.075, 0.085, 0.04, 0, 0.05, 0.04)); bodyG.add(g);
    }
  } else if (o.ears === 'long') {

      const g = new THREE.Group(); g.position.set(s * 0.15 * sx, top - 0.04, -0.02); g.rotation.z = -s * 0.2; g.rotation.x = -0.12;
      const a = new THREE.Mesh(G.capOut, earM); a.position.y = 0.26; a.scale.z = 0.6; a.castShadow = true;
      const b = new THREE.Mesh(G.capIn, inM); b.position.set(0, 0.26, 0.035); b.scale.z = 0.5; g.add(a, b); bodyG.add(g);
    }
  } else if (o.ears === 'cat') {
    for (const s of [-1, 1]) {

      g.add(part(G.cone, earM, 0.15, 0.24, 0.09, 0, 0.1, 0, true)); g.add(part(G.cone, inM, 0.09, 0.15, 0.05, 0, 0.07, 0.04)); bodyG.add(g);

}

  const ctx = audio.ctx; if (!ctx) return;
  while (audio.nextTime < ctx.currentTime + 0.35) {
    const s = audio.step % MELODY.length, t = audio.nextTime;
    if (audio.enabled && ctx.state === 'running') {
      if (MELODY[s]) bell(MELODY[s], t, 0.2, 1.5);
      const bar = (s / 8) | 0, k = s % 8;
      if (k === 0) soft(BASS[bar][0], t, 0.16, 1.4);
      if (k === 4) soft(BASS[bar][1], t, 0.11, 1.0);
    }
    audio.nextTime += EIGHTH; audio.step++;
  }
}
function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended' && audio.enabled) audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = new AC(); audio.ctx = ctx;
  audio.master = ctx.createGain(); audio.master.gain.value = audio.enabled ? 0.7 : 0;
  const comp = ctx.createDynamicsCompressor(); audio.master.connect(comp); comp.connect(ctx.destination);
  audio.bus = ctx.createGain();
  const dry = ctx.createGain(); dry.gain.value = 0.8; audio.bus.connect(dry); dry.connect(audio.master);
  const conv = ctx.createConvolver(), len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  conv.buffer = ir; const wet = ctx.createGain(); wet.gain.value = 0.35; audio.bus.connect(conv); conv.connect(wet); wet.connect(audio.master);
  audio.nextTime = ctx.currentTime + 0.1; audio.timer = setInterval(tick, 80);
  if (ctx.state === 'suspended') ctx.resume();
}
const soundBtn = $('sound'); let skipToggle = false;
function startOnGesture(e) {
  if (audio.started && audio.ctx && audio.ctx.state === 'running') return;
  if (e && e.target && e.target.closest && e.target.closest('#sound') && !audio.started) skipToggle = true;
  initAudio();
  if (audio.ctx) {
    audio.started = true; setHint(false);
    if (audio.ctx.state === 'running') ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(n => removeEventListener(n, startOnGesture, true));
  }
}
['pointerdown', 'touchstart', 'keydown', 'click'].forEach(n => addEventListener(n, startOnGesture, true));
soundBtn.addEventListener('click', () => {
  if (skipToggle) { skipToggle = false; return; }
  audio.enabled = !audio.enabled;
  soundBtn.textContent = audio.enabled ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-label', audio.enabled ? '소리 끄기' : '소리 켜기');
  if (audio.ctx) { audio.master.gain.setTargetAtTime(audio.enabled ? 0.7 : 0, audio.ctx.currentTime, 0.05); if (audio.enabled && audio.ctx.state === 'suspended') audio.ctx.resume(); }
  else if (audio.enabled) initAudio();
});
document.addEventListener('visibilitychange', () => {
  if (!audio.ctx) return;
  if (document.hidden) audio.ctx.suspend(); else if (audio.enabled) audio.ctx.resume();
});

/* ---------------- 안내 문구 ---------------- */
const hint = $('hint'); let hintTimer = 0;
function setHint(pre) {
  if (pre) { hint.textContent = isTouch ? '터치하면 음악이 시작돼요 ♪  왼쪽 아래 조이스틱으로 걸어 보세요' : '클릭하면 음악이 시작돼요 ♪  WASD·방향키 이동 / Space 점프 / 드래그로 시점'; hint.style.opacity = 1; }
  else {
    hint.textContent = isTouch ? '조이스틱으로 이동 · 화면을 끌어 시점 돌리기' : 'WASD·방향키 이동 / Space 점프 / 드래그·Q·E로 시점';
    hint.style.opacity = 1; clearTimeout(hintTimer); hintTimer = setTimeout(() => hint.style.opacity = 0, 6000);
  }
}
setHint(true);

/* ---------------- 리사이즈 ---------------- */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); addEventListener('orientationchange', resize); resize();

/* ---------------- 메인 루프 ---------------- */
const SPEED = 5.5, v3 = new THREE.Vector3(), lookT = new THREE.Vector3(), camDesired = new THREE.Vector3();
let last = performance.now(), time = 0, firstFrame = true, snapCam = true, accT = 0, accN = 0;

function spawnRipple(x, z) {
  const r = ripples[rpIdx++ % ripples.length]; r.t = 0; r.m.position.set(x, -0.12, z); r.m.visible = true;
}

function frame(now) {
  let dt = (now - last) / 1000; last = now; dt = Math.min(dt, 0.05); time += dt;
  accT += dt; accN++;
  if (accT > 2.5) { const avg = accT / accN; if (avg > 0.028 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.5); renderer.setPixelRatio(pixelRatio); resize(); } accT = 0; accN = 0; }

  waterTex.offset.x -= dt * 0.05;

  if (keys.has('KeyQ')) camYaw += 1.8 * dt; if (keys.has('KeyE')) camYaw -= 1.8 * dt;

  /* 플레이어 */
  const [ix, iy] = readInput();
  const sY = Math.sin(camYaw), cY = Math.cos(camYaw);
  const wx = sY * iy - cY * ix, wz = cY * iy + sY * ix;
  const groundNow = walkAt(player.x, player.z), inWater = groundNow < -0.12 && player.jumpY < 0.05;
  const spdMul = inWater ? 0.8 : 1;
  const k = 1 - Math.exp(-dt * 12);
  player.vx += (wx * SPEED * spdMul - player.vx) * k; player.vz += (wz * SPEED * spdMul - player.vz) * k;
  player.x += player.vx * dt; player.z += player.vz * dt;
  resolve(player, 0.42); clampRadius(player, 29.0);
  const spd = Math.hypot(player.vx, player.vz);
  if (spd > 0.4) player.heading += wrapPI(Math.atan2(player.vx, player.vz) - player.heading) * (1 - Math.exp(-dt * 14));
  if (Math.abs(ix) > 0.05 && iy > -0.2) camYaw -= ix * 0.9 * dt;
  player.phase += dt * spd * 2.0;
  player.jumpV -= 18 * dt; player.jumpY += player.jumpV * dt; if (player.jumpY <= 0) { player.jumpY = 0; if (player.jumpV < 0) player.jumpV = 0; }
  player.gy += (walkAt(player.x, player.z) - player.gy) * (1 - Math.exp(-dt * 18));
  player.y = player.gy + player.jumpY;
  playerMesh.position.set(player.x, player.y, player.z); playerMesh.rotation.y = player.heading;
  animateCritter(playerMesh, player.phase, clamp(spd / SPEED, 0, 1), player.jumpY > 0.05 ? 0.9 : 0);
  if (inWater && spd > 0.8) { rippleCd -= dt; if (rippleCd <= 0) { spawnRipple(player.x + rand(-0.15, 0.15), player.z + rand(-0.15, 0.15)); rippleCd = 0.2; } }
  for (const r of ripples) if (r.t < 1) {
    r.t += dt / 0.9; const s = 1 + r.t * 2.8; r.m.scale.set(s, 1, s); r.m.material.opacity = 0.7 * (1 - Math.min(1, r.t));
    if (r.t >= 1) r.m.visible = false;
  }

  /* 친구들 */
  const W = innerWidth, H = innerHeight;
  for (const f of friends) {
    const dxp = player.x - f.x, dzp = player.z - f.z, dp = Math.hypot(dxp, dzp), was = f.near;
    f.near = was ? dp < 6.5 : dp < 5;
    let moving = false;
    if (f.near) {
      f.targetHeading = Math.atan2(dxp, dzp);
      f.hopCool -= dt; if (f.hopCool <= 0 && f.hopT < 0) { f.hopT = 0; f.hopCool = 1.3 + rng() * 0.8; }
      if (!was) { f.msg = (f.msg + 1 + ((rng() * 3) | 0)) % f.lines.length; f.el.textContent = f.lines[f.msg]; f.msgT = 3.2; }
      else { f.msgT -= dt; if (f.msgT <= 0) { f.msg = (f.msg + 1) % f.lines.length; f.el.textContent = f.lines[f.msg]; f.msgT = 3.2; } }
    } else {
      if (f.wait > 0) f.wait -= dt;
      else {
        const dx = f.tx - f.x, dz = f.tz - f.z, d = Math.hypot(dx, dz);
        if (d < 0.35) { f.wait = 1.5 + rng() * 3.5; pickTarget(f); }
        else {
          const step = Math.min(d, f.speed * dt), ox = f.x, oz = f.z;
          f.x += dx / d * step; f.z += dz / d * step; resolve(f, 0.4); clampRadius(f, 27);
          f.targetHeading = Math.atan2(dx, dz); moving = true;
          if (Math.hypot(f.x - ox, f.z - oz) < step * 0.4) { f.stuck += dt; if (f.stuck > 0.6) { pickTarget(f); f.stuck = 0; } } else f.stuck = 0;
        }
      }
      f.hopCool -= dt; if (f.hopCool <= 0 && f.hopT < 0) { f.hopT = 0; f.hopCool = 2.5 + rng() * 5; }
    }
    if (dp < 0.85 && dp > 0.001) { const push = (0.85 - dp) * 0.5; f.x -= dxp / dp * push; f.z -= dzp / dp * push; }
    f.heading += wrapPI(f.targetHeading - f.heading) * (1 - Math.exp(-dt * 8));
    let hopY = 0, hopA = 0;
    if (f.hopT >= 0) { f.hopT += dt; const kk = f.hopT / 0.55; if (kk >= 1) f.hopT = -1; else { hopA = Math.sin(kk * Math.PI); hopY = hopA * 0.5; } }
    f.sf += ((moving ? 1 : 0) - f.sf) * (1 - Math.exp(-dt * 10)); if (moving) f.phase += dt * f.speed * 3.2;
    const gy = walkAt(f.x, f.z);
    f.mesh.position.set(f.x, gy + hopY, f.z); f.mesh.rotation.y = f.heading;
    animateCritter(f.mesh, f.phase, f.sf, hopA);
    v3.set(f.x, gy + hopY + f.mesh.userData.top + 0.2, f.z).project(camera);
    const vis = f.near && v3.z < 1 && Math.abs(v3.x) < 1.2 && Math.abs(v3.y) < 1.2;
    f.el.classList.toggle('show', vis);
    if (vis) f.el.style.transform = `translate(${(v3.x * 0.5 + 0.5) * W}px,${(-v3.y * 0.5 + 0.5) * H}px) translate(-50%,-100%) translateY(-6px)`;
  }

  /* 나비 · 오리 · 구름 · 연기 */
  for (const b of butterflies) {
    const a = time * b.sp + b.ph, x = b.cx + Math.cos(a) * b.rr, z = b.cz + Math.sin(a * 1.3) * b.rr;
    b.g.position.set(x, Math.max(0, terrainAt(x, z)) + 1.3 + Math.sin(time * 1.7 + b.ph) * 0.35, z);
    b.g.rotation.y = Math.atan2(-Math.sin(a) * b.sp, Math.cos(a * 1.3) * 1.3 * b.sp) + (b.sp < 0 ? Math.PI : 0);
    const fl = Math.sin(time * 18 + b.ph) * 0.8; b.wings[0].rotation.z = fl; b.wings[1].rotation.z = -fl;
  }
  for (const d of ducks) {
    d.x += d.sp * dt; if (d.x > 28) d.x = -28; if (d.x < -28) d.x = 28;
    const sg = Math.sign(d.sp);
    d.g.position.set(d.x, -0.12 + Math.sin(time * 2 + d.ph) * 0.02, cz(d.x) + d.off);
    d.g.rotation.y = Math.atan2(sg, sg * czp(d.x));
  }
  for (const c of clouds) { c.m.position.x += c.v * dt; if (c.m.position.x > 90) c.m.position.x = -90; }
  for (const s of smoke) {
    s.t = (s.t + dt * 0.22) % 1; s.mesh.position.set(1.5 + s.t * 0.6, 4.0 + s.t * 2.4, -1.0); s.mesh.scale.setScalar(0.2 + s.t * 0.5); s.mesh.material.opacity = 0.6 * (1 - s.t);
  }

  /* 카메라 */
  const portrait = camera.aspect < 0.8, dist = portrait ? 10.5 : 8.5, hgt = camHeight + (portrait ? 1.0 : 0);
  camDesired.set(player.x - Math.sin(camYaw) * dist, player.y + hgt, player.z - Math.cos(camYaw) * dist);
  camDesired.y = Math.max(camDesired.y, terrainAt(camDesired.x, camDesired.z) + 1.5, 1.2);
  lookT.set(player.x, player.y + 1.0, player.z);
  if (snapCam) { camera.position.copy(camDesired); camera.userData.look = lookT.clone(); snapCam = false; }
  camera.position.lerp(camDesired, 1 - Math.exp(-dt * 5));
  camera.userData.look.lerp(lookT, 1 - Math.exp(-dt * 10));
  camera.lookAt(camera.userData.look);

  /* 그림자 따라가기 */
  const sx = Math.round(player.x / 0.5) * 0.5, sz = Math.round(player.z / 0.5) * 0.5;
  sun.target.position.set(sx, 0, sz); sun.position.set(sx + SUN_OFF.x, SUN_OFF.y, sz + SUN_OFF.z);

  renderer.render(scene, camera);
  if (firstFrame) { firstFrame = false; $('loading').classList.add('hide'); }
}
renderer.setAnimationLoop(frame);
</script>
